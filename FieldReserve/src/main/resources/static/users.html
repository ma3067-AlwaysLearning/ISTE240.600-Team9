<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FieldReserve - Users</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/index.html">FieldReserve</a>
    </div>
</nav>

<div class="container mt-5">

    <h1 class="mb-3">User Management</h1>
    <p class="text-muted">Add, view, search, edit, and delete users.</p>

    <div id="messageArea"></div>

    <!-- Search -->
    <div class="card mb-4">
        <div class="card-body">
            <h5>Search User by Email</h5>

            <div class="row">
                <div class="col-md-8">
                    <input type="text" id="searchEmail" class="form-control" placeholder="Enter email">
                </div>

                <div class="col-md-4">
                    <button class="btn btn-primary" onclick="searchUsers()">Search</button>
                    <button class="btn btn-secondary" onclick="loadUsers()">Show All</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Form -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 id="formTitle">Add User</h5>

            <form id="userForm">
                <input type="hidden" id="userId">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" id="phone" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-select">
                        <option value="Customer">Customer</option>
                        <option value="Admin">Admin</option>
                        <option value="Manager">Manager</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="text" id="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success">Save User</button>
                <button type="button" class="btn btn-outline-secondary" onclick="clearForm()">Clear</button>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="alert alert-info d-none">
        Loading users...
    </div>

    <!-- Users Table -->
    <div class="card">
        <div class="card-body">
            <h5>Users Table</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="/js/users.js"></script>

</body>
</html>

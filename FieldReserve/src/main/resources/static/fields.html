<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Field Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Field Management</h2>

    <!--Alert-->
    <div id="alertBox"></div>

    <!--Search-->
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search by name...">

    <!--Table-->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Location</th>
                <th>Rate</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="fieldTable"></tbody>
        </table>
    </div>

    <!--Add Form-->
    <h4 class="mt-4">Add Field</h4>
    <form id="fieldForm">
        <div class="row">
            <div class="col"><input class="form-control" placeholder="Name" id="name" required></div>
            <div class="col"><input class="form-control" placeholder="Location" id="location" required></div>
            <div class="col"><input class="form-control" type="number" placeholder="Rate" id="rate" required></div>
            <div class="col">
                <select class="form-control" id="status">
                    <option>AVAILABLE</option>
                    <option>BOOKED</option>
                </select>
            </div>
            <div class="col"><button class="btn btn-primary">Add</button></div>
        </div>
    </form>

    <!--Loading-->
    <div id="loading" class="text-center mt-3" style="display:none;">
        <div class="spinner-border"></div>
    </div>
</div>

<script src="js/fields.js"></script>
</body>

</html>
